<!DOCTYPE html>

<html>

<head>

    <title>AI Diabetes Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🩺 Diabetes Prediction</h1>

        <form method="POST">

            <div class="grid">

                <input type="number" step="any" name="preg" placeholder="Pregnancies" required>

                <input type="number" step="any" name="glucose" placeholder="Glucose Level" required>

                <input type="number" step="any" name="bp" placeholder="Blood Pressure" required>

                <input type="number" step="any" name="skin" placeholder="Skin Thickness" required>

                <input type="number" step="any" name="insulin" placeholder="Insulin" required>

                <input type="number" step="any" name="bmi" placeholder="BMI" required>

                <input type="number" step="any" name="pedigree" placeholder="Diabetes Pedigree" required>

                <input type="number" step="any" name="age" placeholder="Age" required>

            </div>

            <button type="submit">Predict</button>

        </form>

        {% if prediction %}

        <div class="result">
            <h2>Result</h2>

            <h3>{{ prediction }}</h3>

            <p className="diabetic">🩺 Diabetes Probability: {{ diabetic_percent | round(2) }}%</p>
            <p className="non-diabetic">✅ Non-Diabetes Probability: {{ non_diabetic_percent | round(2) }}%</p>

        </div>

        {% endif %}

    </div>

</body>

</html>
